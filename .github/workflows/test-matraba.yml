name: Pruebas MATRABA mensual

on:
  push:
    branches:
      - main
      - integracion-matraba-inicial
  pull_request:
    branches:
      - main
      - integracion-matraba-inicial
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v
