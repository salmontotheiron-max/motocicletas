# Automatización de descarga y publicación de datos MATRABA (DGT).
#
# ESCENARIO ACTIVO: 2
# Descargador Python dedicado, validación estructural de cada TXT,
# inventario diario de cobertura, reintentos y pruebas unitarias.
#
# ESCENARIO 1 CONSERVADO:
# Se mantiene comentado más abajo el método anterior basado en curl/unzip
# dentro del propio workflow. Para recuperarlo habría que activar su bloque
# de calendario y descarga, y desactivar los pasos del escenario 2.
#
# El workflow se define en main, pero ejecuta y publica el código de la
# rama integracion-matraba-inicial. No cambiar esta referencia sin revisar
# la estrategia de ramas y publicación.

name: Actualizar datos MATRABA

on:
  workflow_dispatch:

  # Escenario 2: revisión diaria de la disponibilidad de ficheros DGT.
  schedule:
    - cron: "25 5 * * *"

  # Escenario 1: calendario anterior (días 1, 8, 15, 22 y 30; 28 de febrero).
  # Para volver al escenario 1, comentar el cron diario anterior y descomentar:
  # schedule:
  #   - cron: "25 5 1,8,15,22,30 * *"
  #   - cron: "25 5 28 2 *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      # El código de descarga, procesador y pruebas vive en esta rama.
      - uses: actions/checkout@v5
        with:
          ref: integracion-matraba-inicial

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Escenario 2: detectar regresiones antes de descargar o publicar.
      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v

      # Escenario 2: descargar día a día, validar ZIP/TXT y registrar el
      # estado de cada fecha (descargado, no encontrado, inválido o error).
      - name: Generar inventario diario de descargas DGT
        run: |
          python descargar_matraba.py \
            --start 2026-09-01 \
            --end "$(date -u -d 'yesterday' +%F)" \
            --output-dir datos/matraba \
            --coverage-file public/data/cobertura_diaria.json

      # Procesar los ficheros validados y propagar la cobertura diaria
      # y mensual a los manifiestos públicos.
      - name: Procesar ficheros y cobertura
        run: |
          python procesar_matraba.py \
            --input-dir datos/matraba \
            --output-dir public/data \
            --coverage-file public/data/cobertura_diaria.json

      # Publicar sólo si hay cambios en los agregados/manifiestos.
      - name: Publicar agregados y manifiesto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza agregados MATRABA"
            git push origin integracion-matraba-inicial
          fi

