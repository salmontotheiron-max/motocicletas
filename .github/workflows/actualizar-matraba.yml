name: Actualizar datos MATRABA
on:
  workflow_dispatch:
  schedule:
    - cron: "25 5 * * *"
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: integracion-matraba-inicial
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v
      - name: Generar inventario diario de descargas DGT
        run: python descargar_matraba.py --start 2026-09-01 --end "$(date -u -d 'yesterday' +%F)" --output-dir datos/matraba --coverage-file public/data/cobertura_diaria.json
      - name: Procesar todos los ficheros descargados y su cobertura
        run: python procesar_matraba.py --input-dir datos/matraba --output-dir public/data --coverage-file public/data/cobertura_diaria.json
      - name: Publicar agregados y manifiesto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza agregados MATRABA"
            git push origin integracion-matraba-inicial
          fi
