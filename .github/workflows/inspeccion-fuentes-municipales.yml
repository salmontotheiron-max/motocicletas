name: Inspección de fuentes municipales oficiales

on:
  push:
    branches:
      - analisis-municipal-prioritarias
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  inspeccionar-fuentes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencia de lectura XLSX
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Descargar fuentes oficiales
        run: |
          set -euo pipefail
          mkdir -p fuentes-municipales
          curl --fail --location --retry 3 --silent --show-error \
            "https://www.ine.es/jaxiT3/files/t/csv_bdsc/29005.csv" \
            --output fuentes-municipales/ine_padron_29005.csv
          curl --fail --location --retry 3 --silent --show-error \
            "https://www.dgt.es/export/sites/web-DGT/.galleries/downloads/dgt-en-cifras/informacion_municipal/Datos-municipales-general/DatosMunicipalesGeneral_2025.xlsx" \
            --output fuentes-municipales/dgt_municipal_2025.xlsx
          (cd fuentes-municipales && sha256sum ine_padron_29005.csv dgt_municipal_2025.xlsx > SHA256SUMS)

      - name: Inspeccionar estructura y producir inventario
        run: |
          python inspeccionar_fuentes_municipales.py \
            --ine fuentes-municipales/ine_padron_29005.csv \
            --dgt fuentes-municipales/dgt_municipal_2025.xlsx \
            --output fuentes-municipales/inventario_fuentes.txt

      - name: Descargar el artefacto MATRABA del mismo commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 90); do
            RUNS="$(gh run list --workflow "Validación histórica provincial" \
              --branch "$SOURCE_BRANCH" --commit "$SOURCE_SHA" \
              --json databaseId,status,conclusion --limit 20)"
            RUN_ID="$(jq -r '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId // empty' <<< "$RUNS")"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            FAILED="$(jq -r '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<< "$RUNS")"
            if [ "$FAILED" -gt 0 ]; then
              echo "La validación provincial del commit $SOURCE_SHA ha terminado sin éxito."
              jq . <<< "$RUNS"
              exit 1
            fi
            echo "Esperando la validación provincial del commit $SOURCE_SHA (intento $attempt/90)..."
            sleep 20
          done
          test -n "$RUN_ID" || { echo "No se encontró una validación provincial satisfactoria para $SOURCE_SHA"; exit 1; }
          mkdir -p fuentes-municipales/matraba
          gh run download "$RUN_ID" \
            --name validacion-provincial-enero-septiembre-2026 \
            --dir fuentes-municipales/matraba
          MATRABA_CSV="$(find fuentes-municipales/matraba -name composicion_motocicletas_nuevas.csv -print -quit)"
          test -n "$MATRABA_CSV"
          echo "MATRABA_CSV=$MATRABA_CSV" >> "$GITHUB_ENV"
          echo "Artefacto MATRABA obtenido del run $RUN_ID para el commit $SOURCE_SHA"

      - name: Calcular indicadores municipales y validar conciliación
        run: |
          python analizar_concentracion_municipal.py \
            --matraba "$MATRABA_CSV" \
            --ine fuentes-municipales/ine_padron_29005.csv \
            --dgt fuentes-municipales/dgt_municipal_2025.xlsx \
            --output fuentes-municipales/resultados_municipales_2026_ene_sep.csv \
            --summary fuentes-municipales/resumen_municipal_2026_ene_sep.json

      - name: Publicar fuentes y resultados reproducibles
        uses: actions/upload-artifact@v4
        with:
          name: fuentes-y-resultados-municipales-2025-2026
          path: fuentes-municipales/
          retention-days: 7
          if-no-files-found: error
