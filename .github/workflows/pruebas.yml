name: Pruebas automatizadas

on:
  push:
    branches:
      - analisis-municipal-prioritarias
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencia de lectura XLSX
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v
